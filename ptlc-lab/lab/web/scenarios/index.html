<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#06090a" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Dark unless this browser was told otherwise (src/theme.ts).
      try {
        if (localStorage.getItem('ptlc.theme') === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
    <title>PTLC scenarios</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/scenarios/main.ts"></script>
  </body>
</html>
