# Bitcoin Core on regtest for the NoM-to-BTC scenario. The NoM side is the
# devnet on the go-zenon-ptlc branch (docker compose up in that worktree).
#
# The image is the one zenon-zbtc's lab pinned; it is already on this host.
services:
  bitcoind:
    image: bitcoin/bitcoin:31.1@sha256:da25cedc66b1daefff9f412ee196c901a899c3fa68a33b20849c3e08b5c40d63
    container_name: ptlc-bitcoind
    command:
      - -regtest
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0001
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=ptlc
      - -rpcpassword=ptlc
      - -printtoconsole
    ports:
      - "127.0.0.1:18443:18443"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=ptlc", "-rpcpassword=ptlc", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 20
